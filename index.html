<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملعبي — Mal3abi | الإدارة الشاملة</title>
<style>
  :root {
    --bg-main: #0f172a; --bg-card: #1e293b;
    --primary: #6366f1; --primary-hover: #4f46e5;
    --gold: #fbbf24; --gold-hover: #f59e0b;
    --text-main: #e2e8f0; --text-muted: #94a3b8;
    --success: #10b981; --danger: #ef4444; --border: #334155;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; }
  
  /* الشاشات */
  #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
  #app-screen { display: none; }
  
  /* البطاقات والعناصر */
  .card { background: var(--bg-card); padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  .card h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; }
  
  input, select {
    width: 100%; background: #0a0f1a; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; color: var(--text-main); margin-bottom: 15px; outline: none;
  }
  input:focus, select:focus { border-color: var(--primary); }
  
  button {
    width: 100%; background: var(--primary); color: white; border: none; border-radius: 8px;
    padding: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  button:hover { background: var(--primary-hover); }
  button.gold { background: var(--gold); color: #000; }
  button.gold:hover { background: var(--gold-hover); }
  
  /* شريط التبويبات (المنيو) */
  .tabs { display: flex; gap: 10px; background: var(--bg-card); padding: 15px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn { background: transparent; border: 1px solid var(--border); width: auto; padding: 8px 20px; color: var(--text-muted); }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  
  .tab-content { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
  .tab-content.active { display: block; }

  /* تصميم حساب البرو (الذهبي) */
  body.pro-user .navbar h2 { color: var(--gold); }
  body.pro-user .navbar { border-bottom: 2px solid var(--gold); }
  
  .navbar { display: flex; justify-content: space-between; padding: 15px 20px; background: #0a0f1a; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  
  /* جداول اللاعبين والمباريات */
  .list-item { background: #0a0f1a; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .player-badge { background: #334155; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
  
</style>
</head>
<body>

  <!-- تسجيل الدخول -->
  <div id="auth-screen">
    <div class="card" style="width: 400px; text-align: center;">
      <h1 style="color: var(--primary); margin-bottom: 5px;">⚽ ملعبي</h1>
      <p style="color: var(--text-muted); margin-bottom: 20px;">سجل دخول للبدء</p>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="btnLogin" style="margin-bottom: 10px;">تسجيل الدخول</button>
      <button id="btnRegister" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">إنشاء حساب جديد</button>
      <div id="auth-msg" style="color: var(--danger); margin-top: 10px;"></div>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="app-screen">
    <nav class="navbar">
      <h2>ملعبي <span id="plan-badge" style="font-size: 12px; background: #334155; padding: 3px 8px; border-radius: 10px; color: white;">مجاني</span></h2>
      <button id="btnLogout" style="width: auto; background: var(--danger); padding: 5px 15px;">خروج</button>
    </nav>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-tournaments')">🏆 البطولات</button>
      <button class="tab-btn" onclick="switchTab('tab-teams')">👕 الفرق واللاعبين</button>
      <button class="tab-btn" onclick="switchTab('tab-matches')">📅 المباريات</button>
      <button class="tab-btn" onclick="switchTab('tab-subscribe')">💎 تفعيل اشتراك</button>
    </div>

    <!-- تبويب البطولات -->
    <div id="tab-tournaments" class="tab-content active">
      <div class="card">
        <h3>إنشاء بطولة</h3>
        <div class="grid-2">
          <input type="text" id="t-name" placeholder="اسم البطولة">
          <button id="btnCreateTour">إنشاء ➕</button>
        </div>
      </div>
      <div class="card">
        <h3>بطولاتي</h3>
        <div id="tournaments-list"></div>
      </div>
    </div>

    <!-- تبويب الفرق واللاعبين (لوحة المدرب/المنظم) -->
    <div id="tab-teams" class="tab-content">
      <div class="card">
        <h3>إضافة لاعب لفريق</h3>
        <div class="grid-2">
          <input type="text" id="p-name" placeholder="اسم اللاعب (مثال: حيدر)">
          <input type="number" id="p-number" placeholder="رقم القميص (مثال: 10)">
        </div>
        <div class="grid-2">
          <select id="p-position">
            <option value="حارس مرمى">🧤 حارس مرمى</option>
            <option value="دفاع">🛡️ دفاع</option>
            <option value="وسط">⚙️ خط وسط</option>
            <option value="مهاجم">⚽ مهاجم</option>
          </select>
          <button id="btnAddPlayer" class="gold">إضافة اللاعب ✔️</button>
        </div>
      </div>
      <div class="card">
        <h3>قائمة اللاعبين</h3>
        <div id="players-list">
          <!-- مثال ثابت ليوضح الفكرة للمدرب -->
          <div class="list-item">
            <div><strong>عباس</strong> <span class="player-badge">⚽ مهاجم</span></div>
            <div>رقم <span class="player-badge">9</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- تبويب المباريات -->
    <div id="tab-matches" class="tab-content">
      <div class="card">
        <h3>جدولة مباراة</h3>
        <div class="grid-2">
          <input type="text" placeholder="الفريق الأول (المضيف)">
          <input type="text" placeholder="الفريق الثاني (الضيف)">
        </div>
        <div class="grid-2">
          <input type="date">
          <input type="time">
        </div>
        <button>حفظ المباراة 📅</button>
      </div>
    </div>

    <!-- تبويب الاشتراك (نظام الكارتات) -->
    <div id="tab-subscribe" class="tab-content">
      <div class="card" style="text-align: center; max-width: 500px; margin: 0 auto;">
        <h3 style="justify-content: center; color: var(--gold);">ترقية الحساب (تفعيل كارت)</h3>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">أدخل كود الاشتراك الذي اشتريته من الإدارة للحصول على مميزات (البرو) أو (النادي) وفتح عدد فرق غير محدود وتقييم اللاعبين.</p>
        <input type="text" id="card-code" placeholder="أدخل الكود هنا (مثال: MAL-XXXX-YYYY)" style="text-align: center; font-size: 18px; letter-spacing: 2px;">
        <button id="btnRedeemCard" class="gold">تفعيل الاشتراك 💎</button>
        <div id="card-msg" style="margin-top: 15px; font-size: 14px;"></div>
      </div>
    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAaE_9lHxQkApNESYh9quBNZcj9PKnK-jI",
    authDomain: "mansouriya2024.firebaseapp.com",
    projectId: "mansouriya2024"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  let currentUser = null;

  // دوال التنقل بين التبويبات
  window.switchTab = function(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // المصادقة
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      
      // جلب بيانات المستخدم لمعرفة اشتراكه
      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      if(userSnap.exists()) {
        const plan = userSnap.data().plan || 'free';
        document.getElementById('plan-badge').textContent = plan === 'pro' ? 'برو 💎' : 'مجاني';
        if(plan === 'pro') document.body.classList.add('pro-user');
      } else {
        // إنشاء ملف للمستخدم الجديد
        await setDoc(userRef, { email: user.email, plan: 'free' });
      }
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-screen').style.display = 'none';
    }
  });

  document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
  document.getElementById('btnRegister').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
  document.getElementById('btnLogout').onclick = () => signOut(auth);

  // نظام الكارتات (Redeem Code)
  document.getElementById('btnRedeemCard').onclick = async () => {
    const codeInput = document.getElementById('card-code').value;
    const msg = document.getElementById('card-msg');
    msg.textContent = "جاري التحقق...";
    msg.style.color = "var(--text-muted)";

    try {
      // نبحث عن الكارت في قاعدة البيانات
      const q = query(collection(db, "cards"), where("code", "==", codeInput), where("isUsed", "==", false));
      const querySnapshot = await getDocs(q);
      
      if(querySnapshot.empty) {
        msg.textContent = "❌ الكود غير صحيح أو تم استخدامه مسبقاً.";
        msg.style.color = "var(--danger)";
        return;
      }

      // إذا الكارت صحيح، نحدث حالة الكارت إلى (مستخدم) ونرقي حساب المستخدم
      const cardDoc = querySnapshot.docs[0];
      const planType = cardDoc.data().plan; // مثلاً 'pro' أو 'club'
      
      await updateDoc(doc(db, "cards", cardDoc.id), { isUsed: true, usedBy: currentUser.uid });
      await updateDoc(doc(db, "users", currentUser.uid), { plan: planType });

      msg.textContent = "✅ تم تفعيل الاشتراك بنجاح! جاري تحديث الحساب...";
      msg.style.color = "var(--success)";
      setTimeout(() => location.reload(), 2000); // تحديث الصفحة لتطبيق الألوان والمميزات

    } catch (e) {
      msg.textContent = "حدث خطأ: " + e.message;
      msg.style.color = "var(--danger)";
    }
  };

</script>
</body>
</html>
