<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار المنصورية | Mansouriya Radar</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --accent: #059669; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; text-align: center; }
        .card { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; margin-bottom: 10px; }
        .mode-selector { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        button { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; flex: 1; }
        .btn-sender { background: var(--accent); color: white; }
        .btn-viewer { background: var(--primary); color: white; }
        #map { height: 450px; width: 100%; border-radius: 15px; margin-top: 20px; border: 2px solid #e2e8f0; display: none; }
        .status { padding: 15px; border-radius: 10px; background: #f8fafc; margin-top: 10px; display: none; border-right: 5px solid var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <h1>📍 رادار عائلة المنصورية</h1>
    <p>اختر دورك في هذا الجهاز:</p>

    <div class="mode-selector">
        <button class="btn-sender" onclick="initSender()">أنا (إرسال الموقع)</button>
        <button class="btn-viewer" onclick="initViewer()">المراقب (فتح الخارطة)</button>
    </div>

    <div id="status" class="status"></div>
    <div id="map"></div>
</div>

<script>
    // إعدادات Firebase الخاصة بك من الصورة
    const firebaseConfig = {
        apiKey: "AIzaSyAaE_9lHxQkApNESYh9quBNZcj9PKnK-jI",
        authDomain: "mansouriya2024.firebaseapp.com",
        projectId: "mansouriya2024",
        storageBucket: "mansouriya2024.firebasestorage.app",
        messagingSenderId: "456547547834",
        appId: "1:456547547834:web:b7a1e06a5e0ba058dc6083",
        measurementId: "G-W0JCJZGDF1",
        // ملاحظة: تأكد من تفعيل Realtime Database في الكونسول
        databaseURL: "https://mansouriya2024-default-rtdb.firebaseio.com" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let map, marker;

    // --- وضع إرسال الإحداثيات (الموبايل المفقود أو الشخص) ---
    function initSender() {
        showStatus("⏳ جاري محاولة تحديد موقعك...");
        document.getElementById('map').style.display = 'none';

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const myData = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    time: new Date().toLocaleTimeString()
                };
                
                // حفظ الموقع في قاعدة بياناتك
                db.ref('live_tracking/person1').set(myData);
                
                showStatus(`✅ موقعك يُبث الآن!<br>آخر تحديث: ${myData.time}`);
            }, (err) => {
                showStatus("❌ فشل: يرجى تفعيل الـ GPS في الموبايل.");
            }, { enableHighAccuracy: true });
        }
    }

    // --- وضع المراقب (الخارطة) ---
    function initViewer() {
        document.getElementById('map').style.display = 'block';
        showStatus("🔍 بانتظار استلام إحداثيات...");

        if (!map) {
            map = L.map('map').setView([31.05, 46.25], 13); // البداية من الناصرية
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([31.05, 46.25]).addTo(map).bindPopup('موقع الشخص').openPopup();
        }

        // الاستماع للتحديثات الحية من قاعدة بياناتك
        db.ref('live_tracking/person1').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                const latlng = [data.lat, data.lng];
                marker.setLatLng(latlng);
                map.panTo(latlng);
                showStatus(`📍 الشخص متصل الآن<br>آخر تحديث: ${data.time}`);
            }
        });
    }

    function showStatus(msg) {
        const s = document.getElementById('status');
        s.style.display = 'block';
        s.innerHTML = msg;
    }
</script>

</body>
</html>
