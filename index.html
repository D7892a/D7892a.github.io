<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملعبي — Mal3abi | إدارة البطولات</title>
<style>
  :root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #10b981;
    --danger: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; }
  
  /* --- شاشة تسجيل الدخول --- */
  #auth-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;
  }
  .auth-card {
    background: var(--bg-card); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
  }
  .auth-card h1 { color: var(--primary); margin-bottom: 10px; font-size: 28px; }
  .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
  
  /* --- لوحة التحكم (التطبيق) --- */
  #app-screen { display: none; }
  .navbar {
    background: var(--bg-card); padding: 15px 30px; display: flex; justify-content: space-between;
    align-items: center; border-bottom: 1px solid #334155;
  }
  .navbar h2 { color: var(--primary); }
  .user-info { display: flex; align-items: center; gap: 15px; }
  .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
  
  /* --- عناصر مشتركة --- */
  .card { background: var(--bg-card); padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #334155; }
  .card h3 { margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
  
  input, select {
    width: 100%; background: #0a0f1a; border: 1px solid #334155; border-radius: 8px;
    padding: 12px 15px; color: var(--text-main); margin-bottom: 15px; outline: none; transition: 0.3s;
  }
  input:focus, select:focus { border-color: var(--primary); }
  
  button {
    width: 100%; background: var(--primary); color: white; border: none; border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
  }
  button:hover { background: var(--primary-hover); transform: translateY(-2px); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #dc2626; }
  
  .tournament-item {
    background: #0a0f1a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .badge { background: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

  <!-- شاشة الدخول / التسجيل -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1>⚽ ملعبي</h1>
      <p>منصة إدارة البطولات الرياضية</p>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="btnLogin">تسجيل الدخول</button>
      <button id="btnRegister" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">إنشاء حساب جديد</button>
      <div id="auth-msg" style="color: var(--danger); margin-top: 10px; font-size: 13px;"></div>
    </div>
  </div>

  <!-- شاشة التطبيق الرئيسية -->
  <div id="app-screen">
    <nav class="navbar">
      <h2>ملعبي — Mal3abi</h2>
      <div class="user-info">
        <span id="user-email"></span>
        <button id="btnLogout" class="danger" style="width: auto; margin: 0; padding: 8px 15px;">تسجيل خروج</button>
      </div>
    </nav>

    <div class="container">
      <!-- قسم إنشاء بطولة -->
      <div class="card">
        <h3>🏆 إنشاء بطولة جديدة</h3>
        <input type="text" id="t-name" placeholder="اسم البطولة (مثال: كأس شهداء المنصورية)">
        <select id="t-teams">
          <option value="4">4 فرق</option>
          <option value="8">8 فرق (مجاني)</option>
          <option value="16" disabled>16 فريق (برو 🔒)</option>
        </select>
        <button id="btnCreateTour">إنشاء البطولة ➕</button>
        <div id="tour-msg" style="color: var(--success); font-size: 13px; margin-top: 10px;"></div>
      </div>

      <!-- قسم عرض البطولات -->
      <div class="card">
        <h3>📋 بطولاتي</h3>
        <div id="tournaments-list">
          <p style="color: var(--text-muted); font-size: 14px;">جاري تحميل البطولات...</p>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  // استيراد أدوات Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // إعدادات مشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyAaE_9lHxQkApNESYh9quBNZcj9PKnK-jI",
    authDomain: "mansouriya2024.firebaseapp.com",
    projectId: "mansouriya2024",
    storageBucket: "mansouriya2024.appspot.com",
    messagingSenderId: "456547547834",
    appId: "1:456547547834:web:b7a1e06a5e0ba058dc6083"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;

  // عناصر الواجهة
  const authScreen = document.getElementById('auth-screen');
  const appScreen = document.getElementById('app-screen');
  const authMsg = document.getElementById('auth-msg');
  const tourMsg = document.getElementById('tour-msg');
  const tournamentsList = document.getElementById('tournaments-list');

  // مراقبة حالة تسجيل الدخول
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('user-email').textContent = user.email;
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      loadTournaments(); // جلب بطولات المستخدم
    } else {
      currentUser = null;
      authScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  // تسجيل الدخول
  document.getElementById('btnLogin').onclick = async () => {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    try { await signInWithEmailAndPassword(auth, e, p); } 
    catch (err) { authMsg.textContent = "خطأ: " + err.message; }
  };

  // إنشاء حساب
  document.getElementById('btnRegister').onclick = async () => {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    try { await createUserWithEmailAndPassword(auth, e, p); } 
    catch (err) { authMsg.textContent = "خطأ: " + err.message; }
  };

  // تسجيل خروج
  document.getElementById('btnLogout').onclick = () => signOut(auth);

  // إنشاء بطولة جديدة (Firestore)
  document.getElementById('btnCreateTour').onclick = async () => {
    const name = document.getElementById('t-name').value;
    const teamsCount = document.getElementById('t-teams').value;
    
    if (!name) { tourMsg.textContent = "يرجى كتابة اسم البطولة!"; tourMsg.style.color = 'var(--danger)'; return; }

    try {
      await addDoc(collection(db, "tournaments"), {
        ownerId: currentUser.uid,
        name: name,
        teamsCount: parseInt(teamsCount),
        createdAt: serverTimestamp()
      });
      tourMsg.textContent = "✅ تم إنشاء البطولة بنجاح!";
      tourMsg.style.color = 'var(--success)';
      document.getElementById('t-name').value = '';
      loadTournaments(); // تحديث القائمة
    } catch (err) {
      tourMsg.textContent = "❌ خطأ: " + err.message;
      tourMsg.style.color = 'var(--danger)';
    }
  };

  // جلب البطولات الخاصة بالمستخدم الحالي
  async function loadTournaments() {
    tournamentsList.innerHTML = '';
    const q = query(collection(db, "tournaments"), where("ownerId", "==", currentUser.uid));
    const querySnapshot = await getDocs(q);
    
    if (querySnapshot.empty) {
      tournamentsList.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">لا توجد بطولات بعد. ابدأ بإنشاء واحدة!</p>';
      return;
    }

    querySnapshot.forEach((doc) => {
      const tour = doc.data();
      tournamentsList.innerHTML += `
        <div class="tournament-item">
          <div>
            <strong>${tour.name}</strong>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;">عدد الفرق: ${tour.teamsCount}</div>
          </div>
          <span class="badge">إدارة البطولة ⚙️</span>
        </div>
      `;
    });
  }
</script>
</body>
</html>
