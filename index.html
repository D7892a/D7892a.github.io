<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Firebase Advanced Tester</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI,sans-serif;
  background:#020617;
  color:#e2e8f0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:550px;
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 80px rgba(0,0,0,.5);
}

h1{
  color:#818cf8;
  margin-bottom:10px;
  font-size:26px;
}

.desc{
  color:#94a3b8;
  margin-bottom:25px;
  font-size:14px;
}

.status{
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid #1e293b;
  background:#020617;
}

.status.ok{
  border-color:#10b981;
}

.status.err{
  border-color:#ef4444;
}

.status.load{
  border-color:#6366f1;
}

.status-title{
  font-weight:700;
  margin-bottom:4px;
}

.status-desc{
  font-size:13px;
  color:#94a3b8;
}

input{
  width:100%;
  background:#020617;
  border:1px solid #334155;
  color:white;
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
  outline:none;
  transition:.2s;
}

input:focus{
  border-color:#6366f1;
}

button{
  width:100%;
  border:none;
  padding:14px;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  background:#5558e8;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.outline{
  background:transparent;
  border:1px solid #6366f1;
}

hr{
  border:none;
  border-top:1px solid #1e293b;
  margin:25px 0;
}

.logs{
  background:#020617;
  border-radius:14px;
  padding:15px;
  height:220px;
  overflow:auto;
  font-family:monospace;
  font-size:12px;
  line-height:1.8;
  border:1px solid #1e293b;
}

.okText{
  color:#10b981;
}

.errText{
  color:#ef4444;
}

.infoText{
  color:#60a5fa;
}

.warnText{
  color:#f59e0b;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.badge{
  background:#312e81;
  color:#c7d2fe;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
}

.user-box{
  margin-top:15px;
  padding:15px;
  background:#020617;
  border-radius:14px;
  border:1px solid #1e293b;
  display:none;
}

.user-box img{
  width:55px;
  height:55px;
  border-radius:50%;
  margin-bottom:10px;
}

.small{
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="card">

<div class="top">
  <h1>🔥 Firebase Tester</h1>
  <div class="badge" id="projectName">غير متصل</div>
</div>

<div class="desc">
فحص كامل لـ Firebase + كشف الأخطاء بالتفصيل
</div>

<div id="sdk" class="status">
  <div class="status-title">Firebase SDK</div>
  <div class="status-desc">في الانتظار...</div>
</div>

<div id="db" class="status">
  <div class="status-title">Firestore Database</div>
  <div class="status-desc">في الانتظار...</div>
</div>

<div id="auth" class="status">
  <div class="status-title">Authentication</div>
  <div class="status-desc">في الانتظار...</div>
</div>

<hr>

<input type="email" id="email" placeholder="البريد الإلكتروني">
<input type="password" id="password" placeholder="كلمة المرور">

<button onclick="login()" id="loginBtn">
تسجيل دخول
</button>

<button class="outline" onclick="register()" id="registerBtn">
إنشاء حساب
</button>

<button class="outline" onclick="logout()" id="logoutBtn">
تسجيل خروج
</button>

<hr>

<div class="user-box" id="userBox">
  <div id="userInfo"></div>
</div>

<div class="logs" id="logs"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {

  apiKey: "ضع_apiKey",

  authDomain: "ضع_authDomain",

  projectId: "ضع_projectId",

  storageBucket: "ضع_storageBucket",

  messagingSenderId: "ضع_senderId",

  appId: "ضع_appId"

};

let app;
let db;
let auth;

const logs = document.getElementById("logs");

function log(text,type="info"){

  const div = document.createElement("div");

  if(type==="ok") div.className="okText";
  if(type==="err") div.className="errText";
  if(type==="warn") div.className="warnText";
  if(type==="info") div.className="infoText";

  div.innerHTML = "► " + text;

  logs.appendChild(div);

  logs.scrollTop = logs.scrollHeight;
}

function status(id,type,text){

  const el = document.getElementById(id);

  el.className = "status " + type;

  el.querySelector(".status-desc").textContent = text;
}

function firebaseError(error){

  switch(error.code){

    case "auth/user-not-found":
      return "المستخدم غير موجود";

    case "auth/wrong-password":
      return "كلمة المرور غير صحيحة";

    case "auth/email-already-in-use":
      return "البريد مستخدم مسبقاً";

    case "auth/invalid-email":
      return "البريد الإلكتروني غير صالح";

    case "auth/weak-password":
      return "كلمة المرور ضعيفة";

    case "permission-denied":
      return "تم رفض الوصول بواسطة قواعد الأمان";

    case "auth/network-request-failed":
      return "لا يوجد اتصال بالإنترنت";

    default:
      return error.message;
  }
}

async function start(){

  try{

    status("sdk","load","جاري تحميل Firebase");

    app = initializeApp(firebaseConfig);

    db = getFirestore(app);

    auth = getAuth(app);

    document.getElementById("projectName").textContent =
      firebaseConfig.projectId;

    status("sdk","ok","تم تحميل Firebase بنجاح");

    log("Firebase SDK Loaded","ok");

  }catch(error){

    status("sdk","err",firebaseError(error));

    log(firebaseError(error),"err");

    return;
  }

  try{

    status("db","load","جاري فحص Firestore");

    await getDocs(collection(db,"test"));

    status("db","ok","Firestore يعمل");

    log("Firestore Connected","ok");

  }catch(error){

    status("db","err",firebaseError(error));

    log(firebaseError(error),"err");
  }

  onAuthStateChanged(auth,(user)=>{

    if(user){

      status("auth","ok","تم تسجيل الدخول");

      log("User Logged: " + user.email,"ok");

      document.getElementById("userBox").style.display="block";

      document.getElementById("userInfo").innerHTML = `
        <b>${user.email}</b>
        <div class="small">UID: ${user.uid}</div>
      `;

    }else{

      status("auth","ok","Auth جاهز");

      log("No User Logged","warn");

      document.getElementById("userBox").style.display="none";
    }

  });
}

window.login = async ()=>{

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(!email || !password){

    log("املأ جميع الحقول","err");

    return;
  }

  try{

    document.getElementById("loginBtn").disabled = true;

    log("جاري تسجيل الدخول...","info");

    const user =
      await signInWithEmailAndPassword(auth,email,password);

    log("تم تسجيل الدخول: " + user.user.email,"ok");

  }catch(error){

    log(firebaseError(error),"err");

  }

  document.getElementById("loginBtn").disabled = false;
};

window.register = async ()=>{

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  if(password.length < 6){

    log("كلمة المرور لازم 6 أحرف أو أكثر","err");

    return;
  }

  try{

    document.getElementById("registerBtn").disabled = true;

    log("جاري إنشاء الحساب...","info");

    const user =
      await createUserWithEmailAndPassword(auth,email,password);

    log("تم إنشاء الحساب: " + user.user.email,"ok");

  }catch(error){

    log(firebaseError(error),"err");
  }

  document.getElementById("registerBtn").disabled = false;
};

window.logout = async ()=>{

  try{

    await signOut(auth);

    log("تم تسجيل الخروج","warn");

  }catch(error){

    log(firebaseError(error),"err");
  }
};

start();

</script>

</body>
</html>
